name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5

      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --target wasm32-unknown-unknown --release --lib --no-default-features

      - name: Bindgen
        run: wasm-bindgen --target web --out-dir web/pkg --out-name vdf_fmt target/wasm32-unknown-unknown/release/vdf_fmt.wasm

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
